<!DOCTYPE html>
<html lang="en-GB">
<head>

<title>TEAM IQ share image</title>
<style>

  @font-face { font-family: "Inter"; font-weight: 600; src: url("file:///home/ubuntu/teamiq/site/assets/fonts/inter-600.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("file:///home/ubuntu/teamiq/site/assets/fonts/inter-700.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; font-family: "Inter", sans-serif;
    background: #0A0F2C; color: #fff; overflow: hidden; position: relative;
  }
  .glow {

  .wrap { position: relative; z-index: 2; padding: 68px 72px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }

  .eyebrow b { color: #EFAC23; }
  h1 { font-size: 66px; line-height: 1.03; letter-spacing: -.03em; font-weight: 600; max-width: 15ch; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .brand span span { color: #EFAC23; }
  .meta { font-size: 20px; color: #B9C4DA; }
  .bar { width: 96px; height: 5px; background: #EFAC23; border-radius: 3px; margin-bottom: 26px; }
</style>
</head>
<body>
  <div class="glow"></div>

    <circle cx="17" cy="17" r="2.4" fill="#6E9BF5"/>

  <div class="wrap">

      <div class="bar"></div>
      <p class="eyebrow"><b>TEAM IQ</b> CREATOR</p>

    <div class="foot">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 26 26" aria-hidden="true">

        <span>TEAM <span>IQ</span></span>

    </div>

</html>
