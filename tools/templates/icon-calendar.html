<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>TEAM IQ calendar logo</title>
<!-- Rendered at 180 x 180 for the booking calendar's logo field.
     The six dots are the six pillars; the amber one is the constraint being
     worked on. Same mark as the favicon and the app icon, so the booking page
     and the website look like the same organisation. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 180px; height: 180px; background: transparent; display: grid; place-items: center; }
  svg { display: block; }
</style>
</head>
<body>
  <svg width="180" height="180" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#0A0F2C"/>
    <circle cx="32" cy="12.5" r="6" fill="#FFFFFF"/>
    <circle cx="48.9" cy="22.3" r="6" fill="#FFFFFF"/>
    <circle cx="48.9" cy="41.7" r="6" fill="#EFAC23"/>
    <circle cx="32" cy="51.5" r="6" fill="#FFFFFF"/>
    <circle cx="15.1" cy="41.7" r="6" fill="#FFFFFF"/>
    <circle cx="15.1" cy="22.3" r="6" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="4.6" fill="#113895"/>
  </svg>
</body>
</html>
